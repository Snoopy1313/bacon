services:
  backend_server:
    build: .
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: 1
  
  web_server:
    build: ./bacon_web
    ports:
      - "5173:5173"


  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    
  updater:
    build: ./bacon_updater
    depends_on:
      - rabbitmq
      - backend_server
    environment:
      PYTHONUNBUFFERED: 1